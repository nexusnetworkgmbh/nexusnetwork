name: NexusNetwork GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexusnetwork-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://nexusnetwork.pro
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run security:source
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:static
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
      - name: Explain production gate
        if: vars.PAGES_PRODUCTION_APPROVED != 'true'
        run: echo "Build verified. Deployment stays disabled until Supabase acceptance and explicit production approval."
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PAGES_PRODUCTION_APPROVED == 'true' && vars.NEXT_PUBLIC_SUPABASE_URL != '' && vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy static website and portal together
        id: deployment
        uses: actions/deploy-pages@v5
